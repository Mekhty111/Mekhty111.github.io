<body>
  <header class="bar">
    <a class="bar__name" href="#top">Mehdi Mehdiyev</a>
    <nav class="bar__nav" aria-label="Sections">
      <a href="#projects">Projects</a>
      <a href="#experience">Experience</a>
      <a href="#skills">Skills</a>
      <a href="#education">Education</a>
    </nav>
    <a class="btn btn--solid btn--sm" data-cv href="cv.pdf" download>Download CV</a>
  </header>

  <main class="page" id="top">
    <!-- ============ INTRO ============ -->
    <section class="intro" aria-labelledby="name">
      <div class="intro__text">
        <p class="label" id="roleLine"></p>
        <h1 id="name" data-bind="name"></h1>
        <p class="intro__lede" data-bind="headline"></p>
        <p class="intro__links" id="links"></p>
      </div>
      <img class="intro__photo" id="avatar" alt="Mehdi Mehdiyev" width="160" height="160" />
    </section>
    <dl class="facts" id="facts"></dl>

    <!-- ============ PROJECTS ============ -->
    <section class="section" id="projects" aria-labelledby="h-projects">
      <h2 class="section__title" id="h-projects">Projects</h2>
      <div id="projectList"></div>
      <p class="more"><a id="moreWork" target="_blank" rel="noopener">More projects on GitHub →</a></p>
    </section>

    <!-- ============ EXPERIENCE ============ -->
    <section class="section" id="experience" aria-labelledby="h-exp">
      <h2 class="section__title" id="h-exp">Experience</h2>
      <div id="experienceList"></div>
    </section>

    <!-- ============ SKILLS ============ -->
    <section class="section" id="skills" aria-labelledby="h-skills">
      <h2 class="section__title" id="h-skills">Skills</h2>
      <dl class="skills" id="skillList"></dl>
    </section>

    <!-- ============ EDUCATION + CERTIFICATES ============ -->
    <section class="section" id="education" aria-labelledby="h-edu">
      <h2 class="section__title" id="h-edu">Education &amp; certificates</h2>
      <div class="split">
        <div id="educationList"></div>
        <ul class="certs" id="certList"></ul>
      </div>
    </section>

    <footer class="footer">
      <p class="footer__ask">Open to a conversation about credit risk, production ML or RAG.</p>
      <p class="intro__links" id="footerLinks"></p>
      <p class="footer__small">© <span id="year"></span> Mehdi Mehdiyev · mehdiyev.dev</p>
    </footer>
  </main>

  <!-- plain resume used only for print / cv.pdf -->
  <article class="cv" id="cv" aria-hidden="true"></article>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
